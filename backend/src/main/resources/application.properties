# StandupFlow Application Properties
# Defaults are overridden by values from config.ini or environment variables

server.port=${SERVER_PORT:${server_port:8080}}
spring.application.name=${APP_NAME:${app_name:StandupFlow-Backend}}

# MariaDB / Database Connection Properties
spring.datasource.url=jdbc:mariadb://${DB_HOST:${db_host:localhost}}:${DB_PORT:${db_port:3306}}/${DB_NAME:${db_name:standupflow_db}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:${db_username:root}}
spring.datasource.password=${DB_PASSWORD:${db_password:escan_123456}}
spring.datasource.driver-class-name=${DB_DRIVER:${db_driver:org.mariadb.jdbc.Driver}}

# JPA Hibernate Dialect & Master Schema Management (Master DB contains ONLY tblOrg_details)
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON config
spring.jackson.serialization.fail-on-empty-beans=false
